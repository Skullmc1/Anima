name: Release Anima Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mod:
    name: Build & Release Anima-mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Anima-mod JAR
        working-directory: Anima-mod
        run: gradle build --no-daemon

      - name: Collect playable mod JAR
        id: collect
        run: |
          mkdir -p release-assets
          find Anima-mod/build/libs -maxdepth 1 -type f -name 'anima-*.jar' ! -name '*-sources.jar' -exec cp {} release-assets/ \;
          ls -la release-assets/
          if [ -z "$(ls -A release-assets)" ]; then
            echo "No playable Anima mod JAR found in Anima-mod/build/libs"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == v0.* || "$TAG_NAME" == *-alpha* || "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-rc* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG_NAME" release-assets/*.jar \
            --title "Anima $TAG_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG
